
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Guru — DKV CLASS</title>
  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/guru.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark small">D</span>
      DKV CLASS
    </a>
    <div class="top-actions">
      <span id="user-email" class="muted"></span>
      <button id="logout-btn" class="outline-btn">Keluar</button>
    </div>
  </header>

  <main class="page-wrap">
    <section class="welcome">
      <p class="eyebrow">DASHBOARD PENGAJAR</p>
      <h1>Halo, Guru!</h1>
      <p class="muted">Bagikan materi dan buat tugas untuk siswa.</p>
    </section>

    <section class="panel">
      <h2>Tambah materi atau tugas</h2>

      <form id="task-form" class="stack">
        <label for="task-title">Judul</label>
        <input id="task-title" maxlength="120"
          placeholder="Contoh: Dasar Tipografi" required>

        <label for="task-description">Deskripsi / instruksi</label>
        <textarea id="task-description" rows="4"
          placeholder="Tuliskan materi atau instruksi tugas..."
          required></textarea>

        <div class="form-row">
          <div>
            <label for="task-due">Tenggat</label>
            <input id="task-due" type="date">
          </div>
          <div>
            <label for="task-kind">Jenis</label>
            <select id="task-kind">
              <option value="materi">Materi</option>
              <option value="tugas">Tugas</option>
            </select>
          </div>
        </div>

        <button class="primary-btn" type="submit">
          Publikasikan
        </button>
        <p id="task-message" class="message" role="status"></p>
      </form>
    </section>

    <section class="panel">
      <div class="section-heading">
        <h2>Materi dan tugas</h2>
        <button id="refresh-tasks" class="outline-btn">
          Muat ulang
        </button>
      </div>
      <div id="teacher-task-list" class="item-list">
        <p class="muted">Memuat data...</p>
      </div>
    </section>

    <p class="footer-credit">DKV CLASS · Buatan Adly</p>
  </main>
</body>
</html>
