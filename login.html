<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Google — DKV CLASS</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">D</div>

    <p class="eyebrow">RUANG KELAS DIGITAL</p>
    <h1>DKV CLASS</h1>
    <p class="muted">
      Belajar, berkarya, dan kumpulkan tugas dalam satu tempat.
    </p>

    <button id="google-login" class="google-btn" type="button">
      <span class="google-g" aria-hidden="true">G</span>
      Masuk dengan Google
    </button>

    <p id="login-message" class="message" role="status"></p>
    <p class="footer-credit">Buatan Adly</p>
  </main>
</body>
</html>
